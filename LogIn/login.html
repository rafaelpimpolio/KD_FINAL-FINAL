<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Account Access | KD Sportswear & Apparel</title>
    <meta name="description" content="Login or sign up as a customer or employee at KD Sportswear & Apparel." />
    <link rel="stylesheet" href="login.css" />
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a href="index.html" class="navbar-brand">KD Sportswear & Apparel</a>
    </div>
</nav>

<section id="auth">
    <div class="container auth-card">

        <div class="section-header">
            <h2>Account Access</h2>
            <p>Login or create an account to continue</p>
        </div>

        <div class="tabs">
            <div class="tabs-list">
                <button class="tab-btn active" data-tab="login">Login</button>
                <button class="tab-btn" data-tab="signup">Sign Up</button>
            </div>

            <div class="tab-content active" id="login">
                <form method="POST" action="crud.php">

                    <input type="hidden" name="action" value="login" />

                    <div class="form-group">
                        <label>Login As</label>
                        <select name="role" required>
                            <option value="">Select role</option>
                            <option value="customer">Customer</option>
                            <option value="employee">Employee</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" name="username" required />
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" required />
                    </div>

                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
            </div>

            <div class="tab-content" id="signup">
                <form id="signupForm" method="POST" action="crud.php">

                    <input type="hidden" name="action" value="signup" />

                    <h3>Create Customer Account</h3>

                    <h4>Customer Details</h4>

                    <div class="form-row">
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" name="first_name" required />
                        </div>

                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" name="last_name" required />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input
                                type="tel"
                                name="phone"
                                pattern="^[0-9]{11}$"
                                placeholder="09XXXXXXXXX"
                                required
                            />
                        </div>

                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" name="email" required />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Barangay</label>
                            <input type="text" name="barangay" required />
                        </div>

                        <div class="form-group">
                            <label>City / Municipality</label>
                            <input type="text" name="city" required />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Province</label>
                            <input type="text" name="province" required />
                        </div>

                        <div class="form-group">
                            <label>Postal Code</label>
                            <input
                                type="text"
                                name="postal_code"
                                pattern="^[0-9]{4}$"
                                required
                            />
                        </div>
                    </div>

                    <h4>Account Information</h4>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" name="username" required />
                        </div>

                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" name="password" required />
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Create Account</button>

                    <div
                        id="signupNotification"
                        style="display:none; margin-top: 1rem; font-weight: 600;"
                    ></div>
                </form>
            </div>
        </div>
    </div>
</section>

<footer>
    <p>© 2025 KD Sportswear & Apparel. All rights reserved.</p>
</footer>

<script src="login.js" defer></script>
</body>
</html>
